<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>EMS ABRAMS — Underwater Medical Center</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Tajawal:wght@400;500;700&family=Inter:wght@500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet"/>
<style>
:root{--abyss:#03080c;--d1:#071019;--teal:#14b8a6;--teal2:#5eead4;--coral:#fb7185;--ink:#dbe9ec;--mute2:#7d97a3;--discord:#5865F2}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tajawal,sans-serif;background:var(--abyss);color:var(--ink);min-height:100vh;overflow-x:hidden}
html[lang=en] body{font-family:Inter,sans-serif}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 900px 600px at 80% -10%,rgba(20,184,166,.1),transparent 60%),radial-gradient(ellipse 700px 500px at 10% 100%,rgba(251,113,133,.06),transparent 60%)}
nav{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:20px 6vw;flex-wrap:wrap;gap:12px}
.brand{font-family:'Space Grotesk',sans-serif;font-weight:700;letter-spacing:2px;font-size:15px}
.brand span{color:var(--teal2)}
.nav-right{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
nav a.nlink{color:var(--mute2);text-decoration:none;font-size:13px;transition:.15s}
nav a.nlink:hover{color:#fff}
.lang-switch{display:flex;background:var(--d1);border:1px solid #1c3244;border-radius:20px;padding:2px}
.lang-btn{border:none;background:none;color:var(--mute2);font-size:11px;font-weight:700;padding:5px 11px;border-radius:16px;cursor:pointer;font-family:'IBM Plex Mono',monospace;letter-spacing:.5px;transition:.15s}
.lang-btn.active{background:var(--teal);color:#04141a}
.login-btn{display:inline-flex;align-items:center;gap:8px;background:var(--discord);color:#fff;text-decoration:none;font-size:13px;font-weight:600;padding:9px 16px;border-radius:9px;transition:.15s}
.login-btn:hover{background:#4752c4;transform:translateY(-1px)}
.login-btn svg{width:16px;height:16px;flex-shrink:0}
.hero{position:relative;z-index:1;padding:9vh 6vw 6vh;text-align:center}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:3px;color:var(--teal2);margin-bottom:14px}
h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(32px,7vw,64px);font-weight:700;line-height:1.05}
h1 .red{color:var(--coral)}h1 .blue{color:var(--teal2);display:block;font-size:0.5em;margin-top:8px;letter-spacing:1px}
.sub{max-width:560px;margin:22px auto 30px;color:var(--mute2);line-height:1.9;font-size:15px}
.cta{display:inline-flex;gap:14px;flex-wrap:wrap;justify-content:center}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 26px;border-radius:10px;font-weight:700;font-size:14px;text-decoration:none;transition:.15s;cursor:pointer;border:none;font-family:inherit}
.btn-p{background:var(--teal);color:#04141a}
.btn-p:hover{background:var(--teal2);transform:translateY(-1px)}
.btn-g{border:1px solid #1c3244;color:var(--ink);background:transparent}
.btn-g:hover{border-color:var(--teal);color:#fff}
.stats{position:relative;z-index:1;display:flex;justify-content:center;gap:60px;padding:30px 6vw 60px;flex-wrap:wrap}
.stat b{font-family:'Space Grotesk',sans-serif;font-size:34px;color:#fff;display:block}
.stat span{font-size:11px;color:var(--mute2);letter-spacing:1px}
.about{position:relative;z-index:1;max-width:700px;margin:0 auto;padding:0 6vw 80px;text-align:center;color:#c7d7dc;line-height:2;font-size:14.5px}
</style>
</head>
<body>
<div class="bg"></div>
<nav>
  <div class="brand">EMS <span>ABRAMS</span></div>
  <div class="nav-right">
    <a class="nlink" href="/apply" data-t="nav_apply">التقديم</a>
    <a class="nlink" href="/handbook" data-t="nav_docs">الدليل</a>
    <div class="lang-switch">
      <button class="lang-btn" onclick="setLang('ar')" id="langAr">عربي</button>
      <button class="lang-btn" onclick="setLang('en')" id="langEn">EN</button>
    </div>
    <a class="login-btn" href="/auth/discord">
      <svg viewBox="0 0 127.14 96.36" fill="currentColor"><path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,46,96.12,53,91.08,65.69,84.69,65.69Z"/></svg>
      <span data-t="nav_login">تسجيل الدخول</span>
    </a>
  </div>
</nav>
<section class="hero">
  <div class="eyebrow">UNDERWATER MEDICAL CENTER</div>
  <h1><span class="red" id="hTitleRed">EMS ABRAMS</span><span class="blue" id="hTitleBlue">EMERGENCY MEDICAL SERVICES</span></h1>
  <p class="sub" id="hSub"></p>
  <div class="cta">
    <a class="btn btn-p" href="/apply" data-t="cta_apply">قدّم الآن</a>
    <a class="btn btn-g" href="/handbook" data-t="cta_docs">اطّلع على الدليل</a>
  </div>
</section>
<div class="stats">
  <div class="stat"><b id="stMembers">—</b><span data-t="stat_members">أعضاء نشطون</span></div>
  <div class="stat"><b id="stMissions">—</b><span data-t="stat_missions">مهمة منجزة</span></div>
</div>
<section class="about">
  <p id="aboutText1"></p><br/>
  <p id="aboutText2"></p>
</section>
<script>
const T = {
  ar: { nav_apply:"التقديم", nav_docs:"الدليل", nav_login:"تسجيل الدخول",
        cta_apply:"قدّم الآن", cta_docs:"اطّلع على الدليل",
        stat_members:"أعضاء نشطون", stat_missions:"مهمة منجزة" },
  en: { nav_apply:"Apply", nav_docs:"Handbook", nav_login:"Login with Discord",
        cta_apply:"Apply Now", cta_docs:"View Handbook",
        stat_members:"Active Members", stat_missions:"Missions Completed" },
};
let content = {};
function applyContent(lang){
  const suffix = lang === "en" ? "_en" : "";
  hTitleRed.textContent  = content["heroTitleRed"+suffix]  || content.heroTitleRed  || "EMS ABRAMS";
  hTitleBlue.textContent = content["heroTitleBlue"+suffix] || content.heroTitleBlue || "";
  hSub.innerHTML         = content["heroSub"+suffix]       || content.heroSub       || "";
  aboutText1.textContent = content["aboutText1"+suffix]    || content.aboutText1    || "";
  aboutText2.textContent = content["aboutText2"+suffix]    || content.aboutText2    || "";
  stMembers.textContent  = content.statMembers  || "—";
  stMissions.textContent = content.statMissions || "—";
}
function setLang(lang){
  document.documentElement.lang = lang;
  document.documentElement.dir  = lang === "ar" ? "rtl" : "ltr";
  document.getElementById("langAr").classList.toggle("active", lang==="ar");
  document.getElementById("langEn").classList.toggle("active", lang==="en");
  document.querySelectorAll("[data-t]").forEach(el=>{
    const k = el.getAttribute("data-t");
    if (T[lang][k]) el.textContent = T[lang][k];
  });
  applyContent(lang);
  localStorage.setItem("ems_lang", lang);
}
fetch("/api/content").then(r=>r.json()).then(c=>{
  content = c;
  setLang(localStorage.getItem("ems_lang") || "ar");
});
</script>
</body>
</html>
