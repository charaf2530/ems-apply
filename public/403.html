<!doctype html>
<html lang="en">
<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Access Denied — EMS ABRAMS</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;500;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#03080c;color:#dbe9ec;font-family:Inter,sans-serif;text-align:center;padding:20px}
html[lang=ar] body{font-family:Tajawal,sans-serif}
h1{font-family:'Space Grotesk',sans-serif;font-size:26px;color:#fb7185;margin-bottom:10px}
p{color:#7d97a3;font-size:14px;margin-bottom:18px}
a{color:#5eead4;text-decoration:none;font-size:13px}
.lang-switch{display:inline-flex;background:#071019;border:1px solid #122130;border-radius:20px;padding:2px;margin-bottom:22px}
.lang-btn{border:none;background:none;color:#7d97a3;font-size:11px;font-weight:700;padding:5px 12px;border-radius:16px;cursor:pointer;font-family:monospace;letter-spacing:.5px;transition:.15s}
.lang-btn.active{background:#14b8a6;color:#04141a}
</style></head>
<body>
<div>
  <div class="lang-switch"><button class="lang-btn active" onclick="setLang('en')" id="langEn">EN</button><button class="lang-btn" onclick="setLang('ar')" id="langAr">عربي</button></div>
  <h1 data-t="h1">🚫 Access Denied</h1>
  <p data-t="p">Your account doesn't have console access. Ask an owner or admin to grant you a role.</p>
  <a href="/" data-t="back">← Back to main site</a>
</div>
<script>
const T = {
  en: { h1:"🚫 Access Denied", p:"Your account doesn't have console access. Ask an owner or admin to grant you a role.", back:"← Back to main site" },
  ar: { h1:"🚫 الوصول مرفوض", p:"حسابك لا يملك صلاحية الدخول للوحة التحكم. اطلب من مالك أو مسؤول منحك رتبة.", back:"← العودة للموقع الرئيسي" },
};
function setLang(lang){
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.getElementById("langEn").classList.toggle("active", lang==="en");
  document.getElementById("langAr").classList.toggle("active", lang==="ar");
  document.querySelectorAll("[data-t]").forEach(el=>{ const k=el.getAttribute("data-t"); if(T[lang][k]) el.textContent=T[lang][k]; });
}
setLang(localStorage.getItem("ems_dash_lang") || localStorage.getItem("ems_personnel_lang") || localStorage.getItem("ems_lang") || "en");
</script>
</body>
</html>
