<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>EMS ABRAMS — Temporarily Unavailable</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;500;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
:root{--abyss:#03080c;--d1:#071019;--teal:#14b8a6;--teal2:#5eead4;--amber:#f7b955;--ink:#dbe9ec;--mute2:#7d97a3}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,sans-serif;background:var(--abyss);color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:20px}
html[lang=ar] body{font-family:Tajawal,sans-serif}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 900px 600px at 80% -10%,rgba(20,184,166,.1),transparent 60%),radial-gradient(ellipse 700px 500px at 10% 100%,rgba(247,185,85,.07),transparent 60%)}
.card{position:relative;z-index:1;max-width:460px;text-align:center;background:var(--d1);border:1px solid #122130;border-radius:16px;padding:40px 30px}
.icon{font-size:38px;margin-bottom:14px}
.brand{font-family:'Space Grotesk',sans-serif;font-weight:700;letter-spacing:2px;font-size:13px;color:var(--teal2);margin-bottom:18px}
h1{font-family:'Space Grotesk',sans-serif;font-size:22px;margin-bottom:10px}
p{color:var(--mute2);font-size:14px;line-height:1.8;margin-bottom:16px}
#customMsg{color:var(--amber);font-size:13.5px;margin-top:10px}
.lang-switch{display:inline-flex;background:#0b1720;border:1px solid #122130;border-radius:20px;padding:2px;margin-bottom:22px}
.lang-btn{border:none;background:none;color:var(--mute2);font-size:11px;font-weight:700;padding:5px 12px;border-radius:16px;cursor:pointer;font-family:monospace;letter-spacing:.5px;transition:.15s}
.lang-btn.active{background:var(--teal);color:#04141a}
</style>
</head>
<body>
<div class="bg"></div>
<div class="card">
  <div class="lang-switch"><button class="lang-btn active" onclick="setLang('en')" id="langEn">EN</button><button class="lang-btn" onclick="setLang('ar')" id="langAr">عربي</button></div>
  <div class="icon">🚧</div>
  <div class="brand">EMS ABRAMS</div>
  <h1 data-t="h1">We'll be right back</h1>
  <p data-t="p">The site is temporarily down for maintenance. Please check back shortly.</p>
  <div id="customMsg"></div>
</div>
<script>
const T = {
  en: { h1:"We'll be right back", p:"The site is temporarily down for maintenance. Please check back shortly." },
  ar: { h1:"سنعود قريباً", p:"الموقع متوقف مؤقتاً لأعمال الصيانة. يرجى المحاولة لاحقاً." },
};
function setLang(lang){
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.getElementById("langEn").classList.toggle("active", lang==="en");
  document.getElementById("langAr").classList.toggle("active", lang==="ar");
  document.querySelectorAll("[data-t]").forEach(el=>{ const k=el.getAttribute("data-t"); if(T[lang][k]) el.textContent=T[lang][k]; });
}
setLang("en");
fetch("/api/maintenance").then(r=>r.json()).then(d=>{
  if (d.maintenanceMessage) document.getElementById("customMsg").textContent = d.maintenanceMessage;
});
</script>
</body>
</html>
